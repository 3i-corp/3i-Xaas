name: Deploy Supabase Edge Functions

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"

  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"

  workflow_dispatch:
    inputs:
      function_name:
        description: "Function slug to deploy, or all to deploy every function"
        required: true
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Edge Functions
    runs-on: ubuntu-latest
    outputs:
      has_functions: ${{ steps.validate_sources.outputs.has_functions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Edge Function sources
        id: validate_sources
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "supabase/functions" ]]; then
            echo "has_functions=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No supabase/functions directory exists yet. Validation and deployment are skipped until Edge Functions are added."
            exit 0
          fi

          mapfile -d '' files < <(find supabase/functions -type f -name '*.ts' -print0)

          if (( ${#files[@]} == 0 )); then
            echo "has_functions=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No TypeScript files found under supabase/functions; deployment is skipped."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking ${file}"
            deno fmt --check "${file}"
            deno lint "${file}"
          done

          mapfile -d '' test_files < <(find supabase/functions -type f -name '*_test.ts' -print0)
          for test_file in "${test_files[@]}"; do
            echo "Testing ${test_file}"
            deno test "${test_file}"
          done

          mapfile -t entrypoints < <(
            find supabase/functions -mindepth 2 -maxdepth 2 -type f -name 'index.ts'
          )

          if (( ${#entrypoints[@]} == 0 )); then
            echo "::error::No Edge Function entrypoints (supabase/functions/<name>/index.ts) found."
            exit 1
          fi

          echo "Validated ${#files[@]} TypeScript file(s) and found ${#entrypoints[@]} function entrypoint(s)."
          echo "has_functions=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Supabase
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    if: >-
      needs.validate.outputs.has_functions == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error::Missing GitHub secret SUPABASE_PROJECT_ID."
            exit 1
          fi

          if [[ ! "${SUPABASE_PROJECT_ID}" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID has an unexpected format."
            exit 1
          fi

          if [[ "${SUPABASE_PROJECT_ID}" != "nxbervftnchjhpaxjqqu" ]]; then
            echo "::error::SUPABASE_PROJECT_ID does not match the configured target project."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy selected Edge Functions
        shell: bash
        env:
          REQUESTED_FUNCTION: ${{ inputs.function_name || 'all' }}
        run: |
          set -euo pipefail

          if [[ ! -d "supabase/functions" ]]; then
            echo "::error::supabase/functions was not found; refusing to deploy."
            exit 1
          fi

          if [[ "${REQUESTED_FUNCTION}" == "all" ]]; then
            supabase functions deploy --use-api --project-ref "${SUPABASE_PROJECT_ID}"
            exit 0
          fi

          if [[ ! "${REQUESTED_FUNCTION}" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::Invalid function slug. Use lowercase letters, digits, hyphens, or underscores."
            exit 1
          fi

          if [[ ! -f "supabase/functions/${REQUESTED_FUNCTION}/index.ts" ]]; then
            echo "::error::Function entrypoint not found: supabase/functions/${REQUESTED_FUNCTION}/index.ts"
            exit 1
          fi

          supabase functions deploy "${REQUESTED_FUNCTION}" --use-api --project-ref "${SUPABASE_PROJECT_ID}"
