name: Supabase Local CI & Integration Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-ci:
    name: Local CI and Supabase integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Required checks must never report success when integration tests were skipped.
      - name: Validate integration test prerequisites
        id: integration_prerequisites
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "supabase/config.toml" ]]; then
            echo "::error::Required file supabase/config.toml is missing; refusing to skip integration tests."
            exit 1
          fi

          if ! node -e "process.exit(require('./package.json').scripts?.['test:integration'] ? 0 : 1)"; then
            echo "::error::Required package.json script test:integration is missing; refusing to skip integration tests."
            exit 1
          fi

          if [[ ! -f "scripts/test-integration.mjs" ]]; then
            echo "::error::Required test runner scripts/test-integration.mjs is missing."
            exit 1
          fi

          echo "PASS: all required local integration test prerequisites are present."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase locally
        id: start_supabase
        run: supabase start

      - name: Generate local environment variables
        shell: bash
        run: |
          set -euo pipefail

          supabase status --output env >> "$GITHUB_ENV"
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"

          service_role_key="$(supabase status --output json | jq -er '.SERVICE_ROLE_KEY')"
          if [[ -z "$service_role_key" || "$service_role_key" == "null" ]]; then
            echo "::error::Could not retrieve the local Supabase service role key."
            exit 1
          fi

          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Run integration tests
        id: integration_tests
        run: npm run test:integration

      - name: Report integration test status
        if: always()
        env:
          PREREQUISITES_OUTCOME: ${{ steps.integration_prerequisites.outcome }}
          START_OUTCOME: ${{ steps.start_supabase.outcome }}
          TEST_OUTCOME: ${{ steps.integration_tests.outcome }}
        run: |
          echo "Integration test workflow summary:"
          echo "Prerequisites: ${PREREQUISITES_OUTCOME:-not-recorded}"
          echo "Local Supabase startup: ${START_OUTCOME:-not-recorded}"
          echo "Integration tests: ${TEST_OUTCOME:-not-recorded}"
          if [[ "${PREREQUISITES_OUTCOME:-}" != "success" || "${START_OUTCOME:-}" != "success" || "${TEST_OUTCOME:-}" != "success" ]]; then
            echo "::error::Local integration tests did not complete successfully."
            exit 1
          fi
          echo "PASS: local Supabase integration tests completed successfully."

      - name: Stop Supabase
        if: always() && steps.start_supabase.outcome == 'success'
        run: supabase stop
